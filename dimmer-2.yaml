substitutions:
  name: boneio-dr-8ch-03-3812b0
  friendly_name: dimmer-2-bedroom
  serial_prefix: dim #Don't change it.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: boneio.dimmer-led
    version: "0.3"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://boneIO-eu/esphome-LM75@main #Original source and thank you note for BTomala https://github.com/boneIO-eu/esphome-lm75
    components: [lm75]
  - source:
      type: local
      path: ./components

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: v1.7.1
    files:
      [
        devices/serial_no.yaml,
        devices/dimmer_i2c.yaml,
        devices/dimmer_ina219.yaml,
        boards/dimmer_output.yaml,
      ]

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_IN
  phy_addr: 1
  power_pin: GPIO16

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-dimmer_8ch-v0_3.yaml@v1.7.1
  import_full_config: true

pcf8574:
  - id: pcf_inputs
    address: 0x38

logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome

web_server:
  port: 80
  local: true

text_sensor:
  - platform: version
    name: boneio-dimmer- Version
    icon: mdi:cube-outline
    entity_category: diagnostic
  - platform: ethernet_info
    ip_address:
      entity_category: diagnostic
      name: boneio-dimmer IP
  - platform: template
    name: Hostname
    id: hostname
    entity_category: diagnostic
    lambda: |-
      return id(eth).get_ip_addresses().empty() ? "Unset" : id(eth).get_ip_addresses()[0].str();
    update_interval: 5min

udp:

packet_transport:
  - platform: udp
    update_interval: 5s
    rolling_code_enable: false
    encryption: !secret dimmer-2-enc_key
    binary_sensors:
      - in_07
    providers:
      - name: boneio-dr-8ch-03-32b304
        encryption: !secret dimmer-3-enc_key
      - name: boneio-dr-8ch-03-32ce68
        encryption: !secret dimmer-1-enc_key
      - name: boneio-dr-8ch-03-32b610
        encryption: !secret dimmer-6-enc_key

binary_sensor:
  - platform: gpio
    name: "3.1 (213)"
    id: in_01
    pin:
      pcf8574: pcf_inputs
      number: 1
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "3.1 (214)"
    id: in_02
    pin:
      pcf8574: pcf_inputs
      number: 2
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "3.1 (217)"
    id: in_03
    pin:
      pcf8574: pcf_inputs
      number: 3
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "3.1 (218)"
    id: in_04
    pin:
      pcf8574: pcf_inputs
      number: 4
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "2.1 (323)"
    id: in_05
    pin:
      number: 36
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "2.1 (324)"
    id: in_06
    pin:
      number: 39
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "2.1 (327)"
    id: in_07
    pin:
      number: 34
      mode:
        input: true
      inverted: true
    # Unconditional "all bedroom lights off": local lights here, plus light_j/light_h
    # on dimmer-3 which listens for this sensor over packet_transport (see export below).
    on_click:
      then:
        - light.turn_off: light_f
        - light.turn_off: light_i
        - light.turn_off: light_e2
        - light.turn_off: light_e1

  - platform: gpio
    name: "2.1 (328)"
    id: in_08
    pin:
      number: 35
      mode:
        input: true
      inverted: true
    on_click:
      then:
        - light.toggle: light_f

  # dimmer-3 buttons in_01/in_02 toggle+dim dimmer-2 lights via hold_dim_button
  # below; in_03 turns the bedroom lights off. The lights live here on dimmer-2.
  - platform: packet_transport
    provider: boneio-dr-8ch-03-32b304
    id: r3_in_01
    remote_id: in_01

  - platform: packet_transport
    provider: boneio-dr-8ch-03-32b304
    id: r3_in_02
    remote_id: in_02

  # Turn off all bedroom lights except light_i and light_j (light_h is turned off
  # locally on dimmer-3). Shared by dimmer-3 in_03 (247) and in_05 (473).
  - platform: packet_transport
    provider: boneio-dr-8ch-03-32b304
    id: r3_in_03
    remote_id: in_03
    on_click: &bedroom_lights_off
      then:
        - light.turn_off: light_f
        - light.turn_off: light_e1
        - light.turn_off: light_e2

  - platform: packet_transport
    provider: boneio-dr-8ch-03-32b304
    id: r3_in_05
    remote_id: in_05
    on_click: *bedroom_lights_off

  - platform: packet_transport
    provider: boneio-dr-8ch-03-32b304
    id: r3_in_08
    remote_id: in_08

  - platform: packet_transport
    provider: boneio-dr-8ch-03-32ce68
    id: r1_ha_all_off
    remote_id: ha_all_off
    on_click:
      then:
        - light.turn_off: light_f
        - light.turn_off: light_i
        - light.turn_off: light_e2
        - light.turn_off: light_e1

  # dimmer-6 button 314 (in_06): turn off all lights except living room + kitchen
  - platform: packet_transport
    provider: boneio-dr-8ch-03-32b610
    id: r6_in_06
    remote_id: in_06
    on_click:
      then:
        - light.turn_off: light_f
        - light.turn_off: light_i
        - light.turn_off: light_e2
        - light.turn_off: light_e1

hold_dim_button:
  # in_01 drives all three as one group: a click toggles them together
  # (any on -> all off, else all on); a hold dims all three together.
  - id: dim_btn_01
    input: in_01
    <<: &light_f
      light_id:
        - id: light_f
          min_brightness: 0.2
        - &e1_dim
          id: light_e1
          min_brightness: 0.3
        - &e2_dim
          id: light_e2
          min_brightness: 0.3
  - id: dim_btn_02
    input: in_02
    light_id: *e2_dim
  - id: dim_btn_03
    input: in_03
    light_id: *e1_dim
  - id: dim_btn_05
    input: in_05
    light_id: [*e1_dim, *e2_dim]
  - id: dim_btn_06
    input: in_06
    <<: *light_f
  - id: dim_btn_08
    input: r3_in_01
    light_id: light_i
  - id: dim_btn_09
    input: r3_in_02
    <<: &light_f_single
      light_id: light_f
      min_brightness: 0.2
  - id: dim_btn_12
    input: r3_in_08
    <<: *light_f_single

light:
  - platform: monochromatic
    output: chl1_2_pair_output
    name: light_f
    id: light_f
    gamma_correct: 0
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: cwww
    id: light_i
    name: light_i
    cold_white: chl03
    warm_white: chl04
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2000 K
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: monochromatic
    id: light_e2
    name: light_e2
    output: chr1_2_pair_output
    gamma_correct: 0
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: monochromatic
    id: light_e1
    name: light_e1
    gamma_correct: 0
    output: chr3_4_pair_output
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: lm75
    id: boneIO_temp
    name: Temperature
    update_interval: 30s
    entity_category: diagnostic
    on_value_range:
      - above: 70.0
        then:
          - switch.turn_on: buzzer
      - below: 70.0
        then:
          - switch.turn_off: buzzer

switch:
  - platform: gpio
    id: buzzer
    name: Buzzer
    pin:
      pcf8574: pcf_inputs
      number: 0
      mode:
        output: true
      inverted: true

output:
  - platform: template
    id: chl1_2_pair_output
    type: float
    write_action:
      - output.set_level:
          id: chl01
          level: !lambda return state;
      - output.set_level:
          id: chl02
          level: !lambda return state;
  - platform: template
    id: chr1_2_pair_output
    type: float
    write_action:
      - output.set_level:
          id: chr01
          level: !lambda return state;
      - output.set_level:
          id: chr02
          level: !lambda return state;
  - platform: template
    id: chr3_4_pair_output
    type: float
    write_action:
      - output.set_level:
          id: chr03
          level: !lambda return state;
      - output.set_level:
          id: chr04
          level: !lambda return state;
