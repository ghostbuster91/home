# Local copy of boards/24x16_output.yaml from github://boneIO-eu/esphome@v1.7.1.
#
# Difference from upstream: out_13..out_16 (mcp_left pins 7/6/5/4) are not plain
# outputs here. Following the upstream boards/8_covers_16_output.yaml convention,
# they are exposed as interlocked gpio switch pairs so they can drive time_based
# covers safely (the generic output switch platform does not support interlock).
# The cover entities + friendly names live in the device config.

switch:
  # Cover 01 -> out_13 (close) / out_14 (open)
  - platform: gpio
    id: cover_close_01_out13
    internal: true
    pin:
      mcp23xxx: mcp_left
      number: 7
      mode:
        output: true
      inverted: false
    interlock: &cover_interlock_01 [cover_close_01_out13, cover_open_01_out14]
    interlock_wait_time: 500ms
    restore_mode: always off
  - platform: gpio
    id: cover_open_01_out14
    internal: true
    pin:
      mcp23xxx: mcp_left
      number: 6
      mode:
        output: true
      inverted: false
    interlock: *cover_interlock_01
    interlock_wait_time: 500ms
    restore_mode: always off

  # Cover 02 -> out_15 (close) / out_16 (open)
  - platform: gpio
    id: cover_close_02_out15
    internal: true
    pin:
      mcp23xxx: mcp_left
      number: 5
      mode:
        output: true
      inverted: false
    interlock: &cover_interlock_02 [cover_close_02_out15, cover_open_02_out16]
    interlock_wait_time: 500ms
    restore_mode: always off
  - platform: gpio
    id: cover_open_02_out16
    internal: true
    pin:
      mcp23xxx: mcp_left
      number: 4
      mode:
        output: true
      inverted: false
    interlock: *cover_interlock_02
    interlock_wait_time: 500ms
    restore_mode: always off

