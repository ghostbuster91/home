sensor:
  - platform: dallas_temp
    address: 0x280723322814e928
    name: "Dallas Sensor 1"
    update_interval: 30s
    id: temp_mata

switch:
  # The water valves used to sit here as eight raw output switches; they are now
  # four valve entities built from valves/water_valve.yaml (see packages: above).

  - platform: output
    id: mata_grzewcza
    name: "Mata grzewcza"
    output: out_24

  # The curtain channels (out_13..out_18) are defined as interlocked
  # gpio switch pairs in boards/24x16_output.yaml:
  #   cover 01 -> cover_close_01_out13 / cover_open_01_out14
  #   cover 02 -> cover_close_02_out15 / cover_open_02_out16
  #   cover 03 -> cover_close_03_out17 / cover_open_03_out18
  # The cover entities below drive them.

script:
  # Toggle both bedroom curtains together via the combined template cover.
  # cover.toggle doesn't reliably drive a template cover, so decide direction
  # from the right curtain's real position and fan open/close out to both.
  - id: toggle_bedroom_curtains
    then:
      - if:
          condition:
            lambda: "return id(bedroom_right_curtain).position > 0.01;"
          then:
            - cover.close: bedroom_curtains
          else:
            - cover.open: bedroom_curtains

cover:
  - platform: time_based
    name: "Sypialnia prawa zasłona"
    id: bedroom_right_curtain
    open_action:
      - switch.turn_on: cover_open_01_out14
    open_duration: 14s
    close_action:
      - switch.turn_on: cover_close_01_out13
    close_duration: 14s
    stop_action:
      - switch.turn_off: cover_close_01_out13
      - switch.turn_off: cover_open_01_out14

  - platform: time_based
    name: "Sypialnia lewa zasłona"
    id: bedroom_left_curtain
    open_action:
      - switch.turn_on: cover_open_02_out16
    open_duration: 11s
    close_action:
      - switch.turn_on: cover_close_02_out15
    close_duration: 11s
    stop_action:
      - switch.turn_off: cover_close_02_out15
      - switch.turn_off: cover_open_02_out16

  - platform: time_based
    name: "Gabinet zasłony"
    id: study_curtains
    open_action:
      - switch.turn_on: cover_open_03_out18
    open_duration: 14s
    close_action:
      - switch.turn_on: cover_close_03_out17
    close_duration: 14s
    stop_action:
      - switch.turn_off: cover_close_03_out17
      - switch.turn_off: cover_open_03_out18

  # Combined bedroom curtains: a single template cover that fans every command
  # out to both physical curtains, the way the light template outputs fan one
  # value out to several PCA channels. Controlling only this entity keeps the two
  # curtains in sync; its state mirrors the right curtain so cover.toggle picks a
  # sane direction even if they ever drifted apart.
  - platform: template
    name: "Sypialnia zasłony"
    id: bedroom_curtains
    device_class: curtain
    assumed_state: true
    lambda: |-
      return id(bedroom_right_curtain).position;
    open_action:
      - cover.open: bedroom_right_curtain
      - cover.open: bedroom_left_curtain
    close_action:
      - cover.close: bedroom_right_curtain
      - cover.close: bedroom_left_curtain
    stop_action:
      - cover.stop: bedroom_right_curtain
      - cover.stop: bedroom_left_curtain

button:
  - platform: template
    name: "Sypialnia zasłony otwórz"
    id: bedroom_curtains_open
    on_press:
      - cover.open: bedroom_right_curtain
      - cover.open: bedroom_left_curtain

  - platform: template
    name: "Sypialnia zasłony zamknij"
    id: bedroom_curtains_close
    on_press:
      - cover.close: bedroom_right_curtain
      - cover.close: bedroom_left_curtain

climate:
  - platform: thermostat
    id: mata_termostat
    name: "Mata grzewcza – termostat"
    sensor: temp_mata

    min_heating_off_time: 60s
    min_heating_run_time: 60s
    min_idle_time: 30s

    heat_deadband: 0.5
    heat_overrun: 0.5

    heat_action:
      - switch.turn_on: mata_grzewcza
    idle_action:
      - switch.turn_off: mata_grzewcza

    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 28
        mode: heat
      - name: Eco
        default_target_temperature_low: 26
    on_control:
      - logger.log: "Control input received; configuration updated!"
      - lambda: |-
          id(bs_mata_on).publish_state(
            x.get_mode() != CLIMATE_MODE_OFF
          );
