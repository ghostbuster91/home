substitutions:
  name: boneio-24-sw-07-737d50
  friendly_name: boneio-1
  serial_prefix: esp #Don't change it.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: boneio.24x16-switches
    version: "0.7"

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_IN
  phy_addr: 1
  power_pin: GPIO16

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-24x16_switches_v0_7.yaml@v1.7.1
  import_full_config: true

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: v1.7.1
    files:
      [
        devices/buzzer.yaml,
        devices/serial_no.yaml,
        devices_v0_7/display.yaml,
        devices_v0_7/i2c.yaml,
        devices_v0_7-v0_9/ina219.yaml,
        devices_v0_7-v0_9/lm75b.yaml,
        devices_v0_7-v0_9/pcf_with_mcp.yaml,
        devices_v0_7-v0_9/one_wire.yaml,
      ]
  # Inlined from boards/24x16_output.yaml so the curtain channels can be driven
  # as gpio switches with interlock (see switch: section below).
  outputs: !include boards/24x16_output.yaml
  # Heating zones. Room temperatures are imported from Home Assistant, which gets
  # them off the Ampio mserver's MQTT broker (ampio/from/<mac>/state/t/1 ->
  # sensor.ampio_<room>_temp); each zone drives one thermoelectric valve.
  zone_lazienka: !include
    file: zones/heating_zone.yaml
    vars:
      zone_id: lazienka
      zone_label: Łazienka
      temp_entity: sensor.czujnik_lazienka # ampio/from/1B6B0/state/t/1
      valve_output: out_21
      target_home: "23"
      target_eco: "21"
  zone_sypialnia: !include
    file: zones/heating_zone.yaml
    vars:
      zone_id: sypialnia
      zone_label: Sypialnia
      temp_entity: sensor.homelab_temp1_temperature # ampio/from/1C60E/state/t/1
      valve_output: out_19
  zone_salon: !include
    file: zones/heating_zone.yaml
    vars:
      zone_id: salon
      zone_label: Salon
      temp_entity: sensor.czujnik_salon # ampio/from/1C625/state/t/1
      valve_output: out_22
  zone_gabinet: !include
    file: zones/heating_zone.yaml
    vars:
      zone_id: gabinet
      zone_label: Gabinet
      temp_entity: sensor.czujnik_gabinet # ampio/from/1C6ED/state/t/1
      valve_output: out_20
  # Motorised water valves, one package instance per valve. Each pair comes off a
  # single 4-core cable per room, so the comments map the core colour onto the
  # valve's own red/green wires: in the brown/blue pair brown is red, in the
  # white/green pair white is red. Which pair feeds hot and which feeds cold is
  # not the same in both rooms - in the bathroom they are swapped relative to the
  # kitchen, so go by the output ids below, not by the colour.
  valve_kitchen_hot: !include
    file: valves/water_valve.yaml
    vars:
      valve_id: kitchen_hot
      valve_label: Kuchnia ciepła
      red_output: out_07 # brown
      green_output: out_01 # blue
  valve_kitchen_cold: !include
    file: valves/water_valve.yaml
    vars:
      valve_id: kitchen_cold
      valve_label: Kuchnia zimna
      red_output: out_04 # white
      green_output: out_10 # green
  valve_bathroom_hot: !include
    file: valves/water_valve.yaml
    vars:
      valve_id: bathroom_hot
      valve_label: Łazienka ciepła
      red_output: out_05 # white
      green_output: out_11 # green
  valve_bathroom_cold: !include
    file: valves/water_valve.yaml
    vars:
      valve_id: bathroom_cold
      valve_label: Łazienka zimna
      red_output: out_08 # brown
      green_output: out_02 # blue
  sdm630:
    url: https://github.com/boneIO-eu/esphome_packages
    ref: 4c88a2ca9a76f9e483d5f79333ee5437395712b1
    files:
      - path: sdm630.yaml
        vars:
          device_name: "Licznik prądu - kuchenka"
          modbus_device_id: "sdm630"
          modbus_device_address: "0xC9"
          modbus_id: "boneio_modbus"
