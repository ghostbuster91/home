# One heating zone: a room temperature, a thermoelectric valve on a relay output,
# and a local thermostat tying the two together. The control loop stays on the
# device, so the timers and hysteresis don't depend on HA round-trips.
#
# This file does NOT define the temperature sensor; it reads whatever
# temp_sensor_id names. Two ways to feed it:
#   - imported from HA: instantiate zones/ha_temp_source.yaml with the same
#     zone_id and leave temp_sensor_id at its default (it defines temp_<zone_id>)
#   - a sensor already on this device, e.g. a boneIO Edge Temp probe on the
#     RS-485 bus: pass temp_sensor_id and instantiate no source package. The zone
#     then needs no HA round-trip and survives an HA or MQTT outage.
# Either way the source needs a `timeout` filter as its fail-safe - see the
# source file, or the sensor: !extend block in the device config.
#
# Instantiate once per zone from packages: with vars
#   zone_id        - slug used for entity ids (ascii, no spaces); must match the
#                    zone_id given to the temperature source package, if any
#   zone_label     - friendly name shown in HA
#   valve_output   - output id from boards/24x16_output.yaml
# temp_sensor_id / target_home / target_eco are optional and fall back to the
# defaults below.
defaults:
  target_home: "21.5"
  target_eco: "19"
  temp_sensor_id: temp_${zone_id}

switch:
  - platform: output
    id: valve_${zone_id}
    name: "Zaworek - ${zone_label}"
    output: ${valve_output}
    restore_mode: ALWAYS_OFF

climate:
  - platform: thermostat
    id: termostat_${zone_id}
    name: "Ogrzewanie - ${zone_label}"
    sensor: ${temp_sensor_id}

    # Thermoelectric actuators need ~3 min to open or close, so keep cycles long.
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 150s

    heat_deadband: 0.3
    heat_overrun: 0.2

    heat_action:
      - switch.turn_on: valve_${zone_id}
    idle_action:
      - switch.turn_off: valve_${zone_id}

    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: ${target_home}
        mode: heat
      - name: Eco
        default_target_temperature_low: ${target_eco}
