substitutions:
  name: boneio-dr-8ch-03-32b610
  friendly_name: dimmer-6-livingroom
  serial_prefix: dim #Don't change it.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: boneio.dimmer-led
    version: "0.3"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://boneIO-eu/esphome-LM75@main #Original source and thank you note for BTomala https://github.com/boneIO-eu/esphome-lm75
    components: [lm75]
  - source:
      type: local
      path: ./components

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: v1.7.1
    files:
      [
        devices/serial_no.yaml,
        devices/dimmer_i2c.yaml,
        devices/dimmer_ina219.yaml,
        boards/dimmer_output.yaml,
      ]

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_IN
  phy_addr: 1
  power_pin: GPIO16

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-dimmer_8ch-v0_3.yaml@v1.7.1
  import_full_config: true

pcf8574:
  - id: pcf_inputs
    address: 0x38

logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome

web_server:
  port: 80
  local: true

time:
  - platform: homeassistant
    timezone: Europe/Warsaw
    id: homeassistant_time

# A click inside this window turns the group on at night_brightness instead of
# brightness. Merged into every hold_dim_button entry below via `<<: *night_mode`.
# The clock comes from Home Assistant (see time: above), so until it syncs after a
# reboot the day brightness applies.
.night_mode: &night_mode
  time_id: homeassistant_time
  night_brightness: 0.3
  night_start: "20:00"
  night_end: "05:00"

text_sensor:
  - platform: version
    name: boneio-dimmer- Version
    icon: mdi:cube-outline
    entity_category: diagnostic
  - platform: ethernet_info
    ip_address:
      entity_category: diagnostic
      name: boneio-dimmer IP
  - platform: template
    name: Hostname
    id: hostname
    entity_category: diagnostic
    lambda: |-
      return id(eth).get_ip_addresses().empty() ? "Unset" : id(eth).get_ip_addresses()[0].str();
    update_interval: 5min

udp:

packet_transport:
  - platform: udp
    update_interval: 5s
    rolling_code_enable: false
    encryption: !secret dimmer-6-enc_key
    binary_sensors:
      - in_01
      - in_06
      - in_08
    providers:
      - name: boneio-dr-8ch-03-32ce68
        encryption: !secret dimmer-1-enc_key
      - name: boneio-dr-8ch-03-31e2c8
        encryption: !secret dimmer-7-enc_key
      - name: boneio-24-sw-07-737d50
        encryption: !secret boneio-1-enc_key
      - name: boneio-dr-8ch-03-39835c
        encryption: !secret dimmer-4-enc_key

binary_sensor:
  - platform: gpio
    name: "10.2 (113)"
    id: in_01
    pin:
      pcf8574: pcf_inputs
      number: 1
      mode:
        input: true
      inverted: true
    on_click:
      then:
        - light.turn_off: light_o
        - light.turn_off: light_p
        - light.turn_off: light_q
        - light.turn_off: light_s

  - platform: gpio
    name: "10.2 (114)"
    id: in_02
    pin:
      pcf8574: pcf_inputs
      number: 2
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "10.2 (117)"
    id: in_03
    pin:
      pcf8574: pcf_inputs
      number: 3
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "10.2 (118)"
    id: in_04
    pin:
      pcf8574: pcf_inputs
      number: 4
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "10.1 (313)"
    id: in_05
    pin:
      number: 36
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "10.1 (314)"
    id: in_06
    pin:
      number: 39
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "10.1 (317)"
    id: in_07
    pin:
      number: 34
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "10.1 (318)"
    id: in_08
    pin:
      number: 35
      mode:
        input: true
      inverted: true

  - platform: packet_transport
    provider: boneio-dr-8ch-03-32ce68
    id: r1_udp_all_off
    remote_id: udp_all_off
    on_click: &all_off_local
      then:
        - light.turn_off: light_o
        - light.turn_off: light_p
        - light.turn_off: light_q
        - light.turn_off: light_s

  - platform: packet_transport
    provider: boneio-dr-8ch-03-31e2c8
    id: r7_in_02
    remote_id: in_02

  - platform: packet_transport
    provider: boneio-dr-8ch-03-31e2c8
    id: r7_in_04
    remote_id: in_04

  - platform: packet_transport
    provider: boneio-dr-8ch-03-31e2c8
    id: r7_in_03
    remote_id: in_03
    on_click:
      then:
        - light.turn_off: light_s
        - light.turn_off: light_q

  # boneio-24 button 333 (in_06): turn off all lights except the bedroom.
  - platform: packet_transport
    provider: boneio-24-sw-07-737d50
    id: r24_in_06
    remote_id: in_06
    on_click: *all_off_local

  # dimmer-4 button 153 (in_01): turn off all lights except light_k (study).
  - platform: packet_transport
    provider: boneio-dr-8ch-03-39835c
    id: r4_in_01
    remote_id: in_01
    on_click: *all_off_local

# Turns off only this dimmer's lights, pressed by the HA "all lights off"
# automation (a reliable per-dimmer path parallel to dimmer-1's UDP broadcast).
button:
  - platform: template
    name: "Wyłącz wszystkie światła HA"
    id: ha_all_off
    on_press: *all_off_local

hold_dim_button:
  - id: dim_btn_02
    <<: *night_mode
    input: in_02
    light_id: light_o
  - id: dim_btn_03
    <<: *night_mode
    input: in_03
    light_id: light_p
    min_brightness: 0.5
  - id: dim_btn_04
    <<: *night_mode
    input: in_04
    light_id: [light_s, light_p, light_o]
  - id: dim_btn_r7_02
    <<: *night_mode
    input: r7_in_02
    light_id: light_s
  - id: dim_btn_r7_04
    <<: *night_mode
    input: r7_in_04
    light_id: light_q
  - id: dim_btn_05
    <<: *night_mode
    input: in_05
    light_id: light_q

light:
  - platform: cwww
    id: light_o
    name: light_o
    cold_white: chl01
    warm_white: chl02
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2000 K
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: cwww
    id: light_p
    name: light_p
    cold_white: chl03
    warm_white: chl04
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2000 K
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: cwww
    id: light_q
    name: light_q
    cold_white: chr01
    warm_white: chr02
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2000 K
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: cwww
    id: light_s
    name: light_s
    cold_white: chr03
    warm_white: chr04
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2000 K
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: lm75
    id: boneIO_temp
    name: Temperature
    update_interval: 30s
    entity_category: diagnostic
    on_value_range:
      - above: 70.0
        then:
          - switch.turn_on: buzzer
      - below: 70.0
        then:
          - switch.turn_off: buzzer

switch:
  - platform: gpio
    id: buzzer
    name: Buzzer
    pin:
      pcf8574: pcf_inputs
      number: 0
      mode:
        output: true
      inverted: true
