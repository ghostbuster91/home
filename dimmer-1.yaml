substitutions:
  name: boneio-dr-8ch-03-32ce68
  friendly_name: dimmer-1-hall
  serial_prefix: dim #Don't change it.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: boneio.dimmer-led
    version: "0.3"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://boneIO-eu/esphome-LM75@main #Original source and thank you note for BTomala https://github.com/boneIO-eu/esphome-lm75
    components: [lm75]
  - source:
      type: local
      path: ./components

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: v1.7.1
    files:
      [
        devices/serial_no.yaml,
        devices/dimmer_i2c.yaml,
        devices/dimmer_ina219.yaml,
        boards/dimmer_output.yaml,
      ]

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_IN
  phy_addr: 1
  power_pin: GPIO16

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-dimmer_8ch-v0_3.yaml@v1.7.1
  import_full_config: true

pcf8574:
  - id: pcf_inputs
    address: 0x38

logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome

web_server:
  port: 80
  local: true

text_sensor:
  - platform: version
    name: boneio-dimmer- Version
    icon: mdi:cube-outline
    entity_category: diagnostic
  - platform: ethernet_info
    ip_address:
      entity_category: diagnostic
      name: boneio-dimmer IP
  - platform: template
    name: Hostname
    id: hostname
    entity_category: diagnostic
    lambda: |-
      return id(eth).get_ip_addresses().empty() ? "Unset" : id(eth).get_ip_addresses()[0].str();
    update_interval: 5min

udp:

packet_transport:
  - platform: udp
    update_interval: 5s
    rolling_code_enable: false
    encryption: !secret dimmer-1-enc_key
    binary_sensors:
      - in_02
      - in_05
      - in_07
      - ha_all_off

binary_sensor:
  - platform: gpio
    name: "1.1 (433)"
    id: in_01
    pin:
      pcf8574: pcf_inputs
      number: 1
      mode:
        input: true
      inverted: true
    on_click:
      then:
        - light.turn_off: light_a1_d1
        - light.turn_off: light_b1_b2
        - binary_sensor.template.publish:
            id: ha_all_off
            state: true
        - delay: 150ms
        - binary_sensor.template.publish:
            id: ha_all_off
            state: false

  - platform: gpio
    name: "1.1 (434)"
    id: in_02
    pin:
      pcf8574: pcf_inputs
      number: 2
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "1.1 (437)"
    id: in_03
    pin:
      pcf8574: pcf_inputs
      number: 3
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "1.1 (438)"
    id: in_04
    pin:
      pcf8574: pcf_inputs
      number: 4
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "12.1 (353)"
    id: in_05
    pin:
      number: 36
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "12.1 (354)"
    id: in_06
    pin:
      number: 39
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "12.1 (357)"
    id: in_07
    pin:
      number: 34
      mode:
        input: true
      inverted: true

  - platform: gpio
    name: "12.1 (358)"
    id: in_08
    pin:
      number: 35
      mode:
        input: true
      inverted: true

  - platform: template
    id: ha_all_off
    internal: true

button:
  - platform: template
    name: "Wyłącz wszystkie światła"
    on_press:
      then:
        - light.turn_off: light_a1_d1
        - light.turn_off: light_b1_b2
        - binary_sensor.template.publish:
            id: ha_all_off
            state: true
        - delay: 150ms
        - binary_sensor.template.publish:
            id: ha_all_off
            state: false

hold_dim_button:
  - id: dim_btn_01
    input: in_03
    light_id: light_b1_b2
    min_brightness: 0.5
  - id: dim_btn_02
    input: in_04
    light_id: light_a1_d1
    min_brightness: 0.2
  - id: dim_btn_03
    input: in_06
    light_id: light_a1_d1
    min_brightness: 0.2

light:
  - platform: monochromatic
    output: chl1_chr3_pair_output
    name: light_a1_d1
    id: light_a1_d1
    gamma_correct: 0
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: monochromatic
    output: chl02
    name: "zasilanie a"
    id: light_a2
    restore_mode: ALWAYS_ON
  - platform: monochromatic
    id: light_b1_b2
    name: light_b1_b2
    output: b_pair_output
    gamma_correct: 0
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: monochromatic
    output: chr04
    name: "zasilanie d"
    id: light_d2
    gamma_correct: 0
    restore_mode: ALWAYS_ON

output:
  - platform: template
    id: chl1_chr3_pair_output
    type: float
    write_action:
      - output.set_level:
          id: chl01
          level: !lambda return state;
      - output.set_level:
          id: chr03
          level: !lambda return state;
  - platform: template
    id: b_pair_output
    type: float
    write_action:
      - output.set_level:
          id: chl03
          level: !lambda return state;
      # - output.set_level:
      #     id: chl04
      #     level: !lambda return state;
      - output.set_level:
          id: chr01
          level: !lambda return state;
      # - output.set_level:
      #     id: chr02
      #     level: !lambda return state;

sensor:
  - platform: lm75
    id: boneIO_temp
    name: Temperature
    update_interval: 30s
    entity_category: diagnostic
    on_value_range:
      - above: 70.0
        then:
          - switch.turn_on: buzzer
      - below: 70.0
        then:
          - switch.turn_off: buzzer

switch:
  - platform: gpio
    id: buzzer
    name: Buzzer
    pin:
      pcf8574: pcf_inputs
      number: 0
      mode:
        output: true
      inverted: true
